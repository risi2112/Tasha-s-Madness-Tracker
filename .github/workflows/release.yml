name: Release module

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build module.zip
        run: zip -r module.zip module.json scripts styles templates lang LICENSE README.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p "require('./module.json').version")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" module.zip module.json --clobber
          else
            gh release create "$TAG" module.zip module.json \
              --title "Tasha's Madness Tracker $TAG" \
              --notes "Automated build from ${{ github.sha }}."
          fi
